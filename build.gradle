buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "galboss.refmap.json"
    config "galboss.mixins.json"
}

repositories {
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        // JEI 软联动用。仓库名/地址与 galtc2 完全一致 —— Gradle 的模块缓存是按仓库身份索引的，
        // 名字对不上就会当作新仓库去联网 HEAD，而这里没网。
        name = 'cursemaven'
        url = 'https://cfa2.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.2')

    // JEI 软联动：只在编译期 + 开发运行期存在，发布时不是前置（mods.toml 里 mandatory=false）。
    // 运行时没装 JEI 时，com/example/galboss/compat/jei 下的类永远不会被加载。
    //
    // 这里优先吃 ForgeGradle 已经生成好的「反混淆后的开发用 jar」（就是 dev classpath 需要的那份
    // 产物），因为本机访问不了 cfa2.cursemaven.com：Gradle 一联网 HEAD 元数据就 Connection reset，
    // 而解析失败会连带把整个 __obfuscated 配置拖垮（geckolib 也会一起报 Could not find）。
    // 缓存缺失时再回退到正常的 curse maven 坐标，联网环境会自动走回退分支。
    def cachedJei = fileTree("${gradle.gradleUserHomeDir}/caches/forge_gradle/deobf_dependencies") {
        include '**/jei-238222-*_mapped_*.jar'
    }.files.find { it.isFile() }

    if (cachedJei != null) {
        compileOnly files(cachedJei)
        runtimeOnly files(cachedJei)
    } else {
        compileOnly fg.deobf("curse.maven:jei-238222:6075247")
        runtimeOnly fg.deobf("curse.maven:jei-238222:6075247")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
    def replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "galboss.mixins.json",
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
